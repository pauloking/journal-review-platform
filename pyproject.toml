[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "journal-review-platform"
version = "0.1.0"
description = "中文科技期刊智能审校能力平台（首领域：医学科技期刊）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "python-multipart>=0.0.9",
  "pydantic>=2.7.0",
  "python-docx>=1.1.0",
  "lxml>=5.0.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["review_platform*"]

[tool.setuptools.package-data]
review_platform = ["knowledge_packs/**/*.json", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
